name: Build Docusaurus Documentation

# 仓库主分支：所有 pull/push 统一引用此变量，避免分支名散落各处
env:
  BRANCH: main

on:
  push:
    branches:
      - main   # 需与上方 env.BRANCH 保持一致
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
          
      - name: Install dependencies
        run: |
          cd docs
          npm ci
          
      - name: Build documentation
        run: |
          cd docs
          npm run build
          
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Check for changes
        id: check-changes
        run: |
          git add -f public/newDocs
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # 使用 stash 临时保存更改，避免 rebase 冲突
          git stash push -m "temp-stash-before-rebase"
          git pull --rebase origin "$BRANCH"
          # 恢复之前暂存的更改
          git stash pop || true
          git commit -m "📚 自动构建文档 | 🔄 更新 Docusaurus 静态页面 [skip ci]"
          git push origin "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
